<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro Concurrente</title>

    <style>

        body {
            font-family: Arial;
            background: #172d45;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 18px;
            width: 350px;
        }

        h1 {
            color: #172033;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            background: #087e8b;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        #resultado {
            margin-top: 20px;
            font-size: 14px;
        }

    </style>

</head>

<body>

    <div class="card">

        <h1>Registro concurrente</h1>

        <p>
            Escribe tu nombre para registrarte
            en nuestra base de datos Cassandra.
        </p>

        <form id="formulario">

            <label>Tu nombre:</label>

            <input
                type="text"
                name="nombre"
                id="nombre"
                required
                maxlength="100"
                placeholder="Ingresa tu nombre"
            >

            <button type="submit" id="boton">
                Registrar
            </button>

        </form>

        <div id="resultado"></div>

    </div>


    <script>

        const formulario = document.getElementById("formulario");

        formulario.addEventListener("submit", async function(event) {

            event.preventDefault();

            const boton = document.getElementById("boton");
            const resultado = document.getElementById("resultado");

            boton.disabled = true;

            resultado.innerText = "Registrando...";

            try {

                const response = await fetch("/api/usuarios", {

                    method: "POST",

                    body: new FormData(formulario)

                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail);
                }

                resultado.innerText =
                    data.mensaje +
                    " | Tiempo: " +
                    data.tiempo_ms +
                    " ms";

                formulario.reset();

            } catch(error) {

                resultado.innerText = error.message;

            } finally {

                boton.disabled = false;

            }

        });

    </script>

</body>

</html>
